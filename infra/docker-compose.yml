version: '3.8'

services:
  # Relational metadata store (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: vessel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vessel_user
      POSTGRES_PASSWORD: vessel_password
      POSTGRES_DB: vessel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vessel_user -d vessel"]
      timeout: 10s
      retries: 5

  # Next.js Application Client
  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: vessel-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://vessel_user:vessel_password@postgres:5432/vessel?schema=public
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
